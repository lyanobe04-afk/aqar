<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqar dashboard layout review</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#0f2942;font:15px system-ui}header,main{max-width:1500px;margin:auto;padding:24px}header{position:sticky;top:0;background:#fff;z-index:1;border-bottom:1px solid #dde4eb}h1{font-size:23px;margin:0 0 12px}select{padding:10px;margin:4px;border:1px solid #ccd5df;border-radius:8px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:white;border-radius:12px;padding:12px}img{width:100%;height:auto;display:block}figcaption{padding:8px;font-weight:600}p{color:#637587}@media(max-width:700px){section{grid-template-columns:1fr}}</style><header><h1>Aqar · Dashboard layout comparison</h1><div id="filters"></div><p>Actual browser screenshots. Each pair uses the same CSS viewport and locale. Scroll naturally in the application; these images show the initial viewport.</p></header><main><section id="pair"></section></main><script>
const choices={platform:['web','flutter'],screen:['account-type','manager','owner','tenant'],lang:['en','ar'],width:[1440,1280,1024,768,390]};const state={platform:'web',screen:'manager',lang:'en',width:1280};for(const [key,values] of Object.entries(choices)){const label=document.createElement('label');label.textContent=key+' ';const select=document.createElement('select');select.setAttribute('aria-label',key);for(const value of values){const option=new Option(value,value);option.selected=value===state[key];select.add(option)}select.onchange=()=>{state[key]=select.value;draw()};label.append(select);document.querySelector('#filters').append(label)}function draw(){const {platform,screen,lang,width}=state;document.querySelector('#pair').innerHTML=['before','after'].map(stage=>`<figure><figcaption>${stage} · ${platform} · ${screen} · ${lang} · ${width}px</figcaption><a href="${stage}/${platform}-${screen}-${lang}-${width}.jpg"><img src="${stage}/${platform}-${screen}-${lang}-${width}.jpg" alt="${stage} ${screen} ${lang} ${width}px"></a></figure>`).join('')}draw();</script></html>
